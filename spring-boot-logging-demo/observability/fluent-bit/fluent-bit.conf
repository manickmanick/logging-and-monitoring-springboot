[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf


[INPUT]
    Name         tail
    Path         /fluent-bit/logs/application.log
    Tag          springboot
    Parser       json


[OUTPUT]
    Name         loki
    Match        springboot
    Host         loki
    Port         3100
    Labels       job=springboot-logging-demo